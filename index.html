<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة التسجيل الرسمية | VIP Portal</title>
    <!-- خط Cairo عالي الدقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #07080a;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(37, 211, 102, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(20, 25, 35, 0.8) 0%, transparent 50%);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* الحاوية الرئيسية - تصميم رسمي فاخر وصارم */
        .promoter-card {
            width: 100%;
            max-width: 440px;
            background: rgba(13, 16, 23, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 40px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.85),
                0 18px 36px -18px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            transform: translateZ(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* لمسة علوية رسمية موحدة بدلاً من قزح القزح */
        .promoter-card::before {
            content: '';
            position: absolute;
            top: 0; 
            left: 20%; 
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(37, 211, 102, 0.6), transparent);
            border-radius: 50%;
        }

        /* الشعار والعنوان */
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(37, 211, 102, 0.3);
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.15);
            margin-bottom: 16px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.5s ease;
            will-change: transform;
        }
        
        .promoter-card:hover .brand-logo { 
            transform: scale(1.03); 
            border-color: rgba(37, 211, 102, 0.6);
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 11px;
            color: #25D366;
            font-weight: 800;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* تنسيق الحقول وسلاستها */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-control {
            width: 100%;
            background: rgba(6, 9, 14, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 16px 18px;
            border-radius: 14px;
            outline: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            appearance: none;
            will-change: border-color, box-shadow, transform;
        }

        .input-control:hover {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(8, 12, 18, 0.85);
        }

        .input-control:focus {
            border-color: #25D366;
            background: rgba(10, 15, 22, 0.95);
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.12), 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            transform: translateY(-1px);
        }

        .input-group:focus-within .input-label {
            color: #25D366;
        }

        .input-control::placeholder { 
            color: #475569; 
            font-weight: 600; 
        }

        /* القائمة المنسدلة */
        select.input-control {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2325D366%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: left 18px center;
            background-size: 12px;
            cursor: pointer;
        }
        select.input-control option { 
            background: #0f141c; 
            color: #f1f5f9; 
            padding: 14px; 
            font-weight: 700; 
        }

        /* شارة شركات الاتصال السلسة */
        .phone-wrapper { position: relative; }
        .phone-input { 
            padding-left: 95px; 
            text-align: left; 
            direction: ltr; 
            font-size: 16px; 
            letter-spacing: 1px; 
        }
        .phone-input::placeholder { text-align: left; letter-spacing: 0; }
        
        .carrier-badge {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%) scale(0.9);
            font-size: 11px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            color: #fff;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        .carrier-badge.active {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .badge-zain { background: #7c3aed; border: 1px solid #8b5cf6; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .badge-asia { background: #dc2626; border: 1px solid #ef4444; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
        .badge-korek { background: #0284c7; border: 1px solid #38bdf8; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }

        /* زر الإرسال الرئيسي - قوي ورسمي وسلس جداً */
        .btn-submit {
            width: 100%;
            padding: 17px 24px;
            background: #25D366;
            color: #041208;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 26px;
            box-shadow: 0 8px 25px -4px rgba(37, 211, 102, 0.4);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow, background-color;
        }

        .btn-submit:hover { 
            background: #22c55e;
            transform: translateY(-2px); 
            box-shadow: 0 14px 30px -4px rgba(37, 211, 102, 0.5); 
        }

        .btn-submit:active { 
            transform: translateY(0) scale(0.98); 
            box-shadow: 0 4px 15px -2px rgba(37, 211, 102, 0.4);
        }

        .wa-icon {
            width: 22px;
            height: 22px;
            fill: #041208;
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-submit:hover .wa-icon {
            transform: scale(1.15) rotate(-5deg);
        }

        /* رسالة التنبيه السلسة */
        #toast {
            position: fixed; 
            top: -100px; 
            left: 50%; 
            transform: translateX(-50%) scale(0.95);
            background: rgba(220, 38, 38, 0.95); 
            color: #fff; 
            padding: 14px 28px;
            border-radius: 50px; 
            font-weight: 800; 
            font-size: 14px; 
            z-index: 999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            text-align: center;
            box-shadow: 0 15px 35px rgba(220, 38, 38, 0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        #toast.show { 
            top: 30px; 
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body>

<div id="toast"><span id="toast-msg"></span></div>

<div class="promoter-card">
    <div class="logo-container">
        <img src="my-image.png" class="brand-logo" alt="Logo">
        <h1 class="title">تسجيل العملاء</h1>
        <div class="subtitle">PROMOTER SYSTEM VIP</div>
    </div>

    <form id="promoterForm" novalidate>
        <!-- الاسم الكامل -->
        <div class="input-group">
            <label class="input-label">الاسم الكامل للزبون</label>
            <input type="text" id="customerName" class="input-control" placeholder="اكتب اسم الزبون..." required autocomplete="off">
        </div>

        <!-- رقم الهاتف -->
        <div class="input-group">
            <label class="input-label">رقم الهاتف</label>
            <div class="input-wrapper phone-wrapper">
                <input type="tel" id="phone" class="input-control phone-input" placeholder="07X XXXX XXXX" maxlength="13" required autocomplete="off">
                <div id="carrierBadge" class="carrier-badge"></div>
            </div>
        </div>

        <!-- المحافظة -->
        <div class="input-group">
            <label class="input-label">المحافظة</label>
            <select id="governorate" class="input-control" required>
                <option value="البصرة" selected>البصرة</option>
                <option value="بغداد">بغداد</option>
                <option value="نينوى">نينوى</option>
                <option value="أربيل">أربيل</option>
                <option value="النجف">النجف</option>
                <option value="كربلاء">كربلاء</option>
                <option value="كركوك">كركوك</option>
                <option value="الأنبار">الأنبار</option>
                <option value="ديالى">ديالى</option>
                <option value="ميسان">ميسان</option>
                <option value="بابل">بابل</option>
                <option value="ذي قار">ذي قار</option>
                <option value="السليمانية">السليمانية</option>
                <option value="دهوك">دهوك</option>
                <option value="المثنى">المثنى</option>
                <option value="القادسية">القادسية</option>
                <option value="واسط">واسط</option>
                <option value="حلبجة">حلبجة</option>
            </select>
        </div>

        <!-- المنطقة -->
        <div class="input-group">
            <label class="input-label">اسم المنطقة / الحي</label>
            <input type="text" id="region" class="input-control" placeholder="مثال: العشار، المنصور..." required autocomplete="off">
        </div>

        <!-- رقم الطلب -->
        <div class="input-group">
            <label class="input-label">رقم الطلب</label>
            <input type="number" id="orderNumber" class="input-control" placeholder="اكتب رقم الطلب هنا..." min="1" required autocomplete="off">
        </div>

        <!-- زر الإرسال -->
        <button type="submit" class="btn-submit">
            <svg class="wa-icon" viewBox="0 0 24 24">
                <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.758.459 3.474 1.33 4.982L2 22l5.122-1.334c1.455.793 3.097 1.21 4.885 1.211h.005c5.507 0 9.99-4.478 9.99-9.985 0-2.667-1.039-5.174-2.928-7.062A9.917 9.917 0 0 0 12.012 2zm5.836 14.129c-.244.688-1.417 1.314-1.982 1.398-.506.076-1.148.107-1.853-.117-.427-.135-.975-.317-1.677-.621-2.951-1.275-4.88-4.246-5.027-4.442-.146-.196-1.196-1.595-1.196-3.044 0-1.448.762-2.158 1.03-2.453.27-.295.588-.368.784-.368.196 0 .392.001.564.01.18.009.423-.068.663.505.244.588.833 2.037.906 2.185.073.147.122.319.025.515-.098.196-.147.319-.294.491-.147.172-.31.385-.442.516-.147.147-.3.308-.129.602.172.294.762 1.251 1.636 2.03 1.123.998 2.07 1.308 2.364 1.455.294.147.466.123.637-.073.172-.196.735-.858.931-1.152.196-.295.392-.245.686-.147.294.098 1.861.877 2.18 1.036.319.159.53.235.603.358.073.123.073.712-.171 1.401z"/>
            </svg>
            <span>إرسال الطلب</span>
        </button>
    </form>
</div>

<script>
    function showToast(message) {
        if (navigator.vibrate) navigator.vibrate(50);
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3200);
    }

    const phoneInput = document.getElementById('phone');
    const carrierBadge = document.getElementById('carrierBadge');

    phoneInput.addEventListener('input', function() {
        let val = this.value.replace(/\D/g, ''); 
        carrierBadge.className = 'carrier-badge';
        
        if (val.startsWith('078') || val.startsWith('079')) {
            carrierBadge.innerText = 'زين'; 
            carrierBadge.classList.add('badge-zain', 'active');
        } else if (val.startsWith('077')) {
            carrierBadge.innerText = 'آسيا'; 
            carrierBadge.classList.add('badge-asia', 'active');
        } else if (val.startsWith('075')) {
            carrierBadge.innerText = 'كورك'; 
            carrierBadge.classList.add('badge-korek', 'active');
        } else {
            carrierBadge.classList.remove('active');
        }

        let formatted = val;
        if (val.length > 4) formatted = val.slice(0, 4) + ' ' + val.slice(4);
        if (val.length > 7) formatted = val.slice(0, 4) + ' ' + val.slice(4, 7) + ' ' + val.slice(7, 11);
        this.value = formatted;
    });

    document.getElementById('promoterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('customerName').value.trim();
        const phone = phoneInput.value.replace(/\s/g, ''); 
        const gov = document.getElementById('governorate').value;
        const region = document.getElementById('region').value.trim();
        const orderNum = document.getElementById('orderNumber').value.trim();

        if (!name) {
            showToast("⚠️ يرجى كتابة اسم الزبون كاملًا");
            return;
        }

        if (phone.length !== 11) { 
            showToast("⚠️ الرجاء التأكد من كتابة 11 رقماً لرقم الهاتف"); 
            return; 
        }

        if (!region) {
            showToast("⚠️ يرجى كتابة اسم المنطقة أو الحي");
            return;
        }

        if (!orderNum) {
            showToast("⚠️ يرجى أدخال رقم الطلب");
            return;
        }

        if (navigator.vibrate) navigator.vibrate(40);

        const targetWhatsAppNumber = "9647888988288"; 
        const messageText = `👤 الاسم الكامل: ${name}\n\n📞 رقم الهاتف  :  ${phone}\n\n📍 العنوان بالتفصيل: \n${gov} - ${region}\n\n✅ رقم الطلب  :  ${orderNum}`;
        const encodedMsg = encodeURIComponent(messageText);

        const nativeUrl = `whatsapp://send?phone=${targetWhatsAppNumber}&text=${encodedMsg}`;

        window.location.href = nativeUrl;

        setTimeout(() => {
            document.getElementById('customerName').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('region').value = '';
            document.getElementById('orderNumber').value = '';
            carrierBadge.className = 'carrier-badge';
        }, 1200);
    });
</script>
</body>
</html>
