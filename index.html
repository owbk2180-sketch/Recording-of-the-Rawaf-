<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الحجز الفاخرة VIP</title>
    <style>
        /* ==========================================
           1. الثيم الرئيسي والترسيم الأولي (Variables)
           ========================================== */
        :root {
            --bg-obsidian: #03060d;
            --card-glass: rgba(13, 20, 36, 0.65);
            --neon-emerald: #00ff9d;
            --neon-cyan: #00f0ff;
            --neon-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
            --carrier-glow: var(--neon-emerald);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* ==========================================
           2. الخلفية الشبكية التفاعلية (Canvas)
           ========================================== */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ==========================================
           3. الحاوية الرئيسية وتأثير الإطار الدوار
           ========================================== */
        .container-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            perspective: 1000px;
        }

        /* شريط الإنجاز الهولوغرافي */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px 4px 0 0;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-emerald));
            box-shadow: 0 0 12px var(--neon-emerald);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* البطاقة الرئيسية الزجاجية */
        .vip-card {
            position: relative;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-glass);
            transition: transform 0.2s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            overflow: hidden;
        }

        /* حواف التدرج اللوني الدوار */
        .vip-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, var(--neon-emerald), transparent, var(--neon-cyan), transparent);
            animation: rotateBorder 8s linear infinite;
            z-index: -2;
            opacity: 0.25;
        }

        .vip-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgba(5, 9, 20, 0.92);
            border-radius: 22px;
            z-index: -1;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ==========================================
           4. الهيدر ورأس الواجهة
           ========================================== */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 157, 0.08);
            border: 1px solid rgba(0, 255, 157, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--neon-emerald);
            font-weight: 600;
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            background-color: var(--neon-emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-emerald);
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        /* ==========================================
           5. حقول الإدخال المحسنة والذكية
           ========================================== */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .custom-input, .custom-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            padding-left: 45px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-select {
            appearance: none;
            cursor: pointer;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        /* الشعاع الليزري للحقل النشط وتحديد الشركة */
        .custom-input:focus, .custom-select:focus {
            border-color: var(--carrier-glow);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.15),
                        inset 0 0 10px rgba(0, 255, 157, 0.05);
            background: rgba(15, 23, 42, 0.85);
        }

        .custom-input:focus ~ .input-icon, .custom-select:focus ~ .input-icon {
            stroke: var(--carrier-glow);
            filter: drop-shadow(0 0 5px var(--carrier-glow));
        }

        .input-group:focus-within .input-label {
            color: var(--neon-cyan);
        }

        /* أيقونة التحقق الذكية */
        .valid-checkmark {
            position: absolute;
            right: 14px;
            width: 18px;
            height: 18px;
            stroke: var(--neon-emerald);
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-group.is-valid .valid-checkmark {
            opacity: 1;
            transform: scale(1);
        }

        /* ==========================================
           6. صندوق معاينة الواتساب الهولوغرافي
           ========================================== */
        .preview-box {
            background: rgba(5, 15, 25, 0.7);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 14px;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .preview-title {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-content {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.6;
            white-space: pre-line;
            font-family: monospace;
        }

        /* ==========================================
           7. زر الإرسال مع السائل المتدفق والتأثيرات
           ========================================== */
        .submit-btn {
            position: relative;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.1), rgba(0, 240, 255, 0.1));
            border: 1px solid var(--neon-emerald);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
            color: #03060d;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.6);
            transform: translateY(-2px);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        /* تأثير التوجيه والاهتزاز للمدخلات الخاطئة */
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shakeError 0.4s ease-in-out;
            border-color: #ff3366 !important;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4) !important;
        }
    </style>
</head>
<body>

    <!-- الخلفية التفاعلية -->
    <canvas id="particleCanvas"></canvas>

    <!-- الحاوية والبطاقة الرئيسية -->
    <div class="container-wrapper" id="cardWrapper">
        <div class="vip-card" id="vipCard">
            
            <!-- شريط التقدم العلوي -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <!-- رأس الواجهة -->
            <div class="card-header">
                <div class="brand-title">منصة التجهيز الرفيعة</div>
                <div class="status-badge">
                    <span class="status-pulse"></span>
                    النظام متصل
                </div>
            </div>

            <!-- نموذج الطلب -->
            <form id="bookingForm" onsubmit="event.preventDefault(); handleSubmit();">
                
                <!-- حقل الاسم الكامل -->
                <div class="input-group" id="groupName">
                    <label class="input-label">الاسم الكامل للعميل</label>
                    <div class="input-wrapper">
                        <input type="text" id="custName" class="custom-input" placeholder="أدخل اسمك الثلاثي..." required oninput="validateForm()">
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <svg class="valid-checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>

                <!-- حقل رقم الهاتف وتحديد خط الاتصال -->
                <div class="input-group" id="groupPhone">
                    <label class="input-label" id="phoneLabel">رقم الهاتف (العراق)</label>
                    <div class="input-wrapper">
                        <input type="tel" id="custPhone" class="custom-input" placeholder="078X XXX XXXX" required oninput="handlePhoneInput(this)">
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <svg class="valid-checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>

                <!-- حقل اختيار المحافظة -->
                <div class="input-group" id="groupCity">
                    <label class="input-label">المحافظة / الإقليم</label>
                    <div class="input-wrapper">
                        <select id="custCity" class="custom-select" required onchange="validateForm()">
                            <option value="" disabled selected>اختر المحافظة...</option>
                            <option value="البصرة">البصرة</option>
                            <option value="بغداد">بغداد</option>
                            <option value="أربيل">أربيل</option>
                            <option value="النجف الأشرف">النجف الأشرف</option>
                            <option value="كربلاء المقدسة">كربلاء المقدسة</option>
                            <option value="ذار قار">ذي قار</option>
                            <option value="باقي المحافظات">باقي المحافظات</option>
                        </select>
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <svg class="valid-checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>

                <!-- حقل البكج والملاحظات -->
                <div class="input-group" id="groupPackage">
                    <label class="input-label">تفاصيل الطلب والباكج</label>
                    <div class="input-wrapper">
                        <input type="text" id="custPackage" class="custom-input" placeholder="مثال: بكج عطور الملكي..." required oninput="validateForm()">
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        <svg class="valid-checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>

                <!-- صندوق المعاينة الحية للرسالة -->
                <div class="preview-box">
                    <div class="preview-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        معاينة التجهيز المباشرة
                    </div>
                    <div class="preview-content" id="previewText">في انتظار إدخال البيانات...</div>
                </div>

                <!-- زر الإرسال الفاخر -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>تأكيد وإرسال الطلب</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>

            </form>
        </div>
    </div>

    <!-- Script والآليات التفاعلية -->
    <script>
        /* ==========================================
           1. محرك خلفية النقاط الشبكية التفاعلية
           ========================================== */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        let mouse = { x: null, y: null, radius: 120 };

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvas();

        window.addEventListener('resize', () => {
            initCanvas();
            createParticles();
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 2 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 1;
            }

            draw() {
                ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    let force = (mouse.radius - distance) / mouse.radius;
                    let directionX = (dx / distance) * force * this.density;
                    let directionY = (dy / distance) * force * this.density;
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }
            }
        }

        function createParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                particlesArray.push(new Particle(x, y));
            }
        }
        createParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].draw();
                particlesArray[i].update();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* ==========================================
           2. تأثير الإمالة ثلاثية الأبعاد (3D Card Tilt)
           ========================================== */
        const cardWrapper = document.getElementById('cardWrapper');
        const vipCard = document.getElementById('vipCard');

        cardWrapper.addEventListener('mousemove', (e) => {
            const rect = cardWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            vipCard.style.transform = `rotateX(${-y / 25}deg) rotateY(${x / 25}deg)`;
        });

        cardWrapper.addEventListener('mouseleave', () => {
            vipCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        /* ==========================================
           3. التوافق الذكي للشركات وشريط الإنجاز
           ========================================== */
        function handlePhoneInput(input) {
            const val = input.value.trim();
            const root = document.documentElement;
            const label = document.getElementById('phoneLabel');

            // اكتشاف مزود الخدمة تلقائياً وتغيير لون التوهج
            if (val.startsWith('077') || val.startsWith('078')) {
                root.style.setProperty('--carrier-glow', '#a855f7'); // زين - بنفسجي
                label.innerText = 'رقم الهاتف (زين العراق)';
            } else if (val.startsWith('075')) {
                root.style.setProperty('--carrier-glow', '#00f0ff'); // كورك - أزرق نيوني
                label.innerText = 'رقم الهاتف (كورك)';
            } else if (val.startsWith('0770') || val.startsWith('0771')) {
                root.style.setProperty('--carrier-glow', '#ff3366'); // آسيا سيل - أحمر
                label.innerText = 'رقم الهاتف (آسيا سيل)';
            } else {
                root.style.setProperty('--carrier-glow', '#00ff9d'); // افتراضي
                label.innerText = 'رقم الهاتف (العراق)';
            }

            validateForm();
        }

        function validateForm() {
            const name = document.getElementById('custName');
            const phone = document.getElementById('custPhone');
            const city = document.getElementById('custCity');
            const pkg = document.getElementById('custPackage');

            let filledFields = 0;
            const totalFields = 4;

            // التحقق وتفعيل علامات الصح
            toggleValidClass(name, name.value.trim().length >= 3, ++filledFields);
            toggleValidClass(phone, phone.value.trim().length >= 10, ++filledFields);
            toggleValidClass(city, city.value !== '', ++filledFields);
            toggleValidClass(pkg, pkg.value.trim().length >= 2, ++filledFields);

            // حساب نسبة شريط التقدم
            let validCount = document.querySelectorAll('.input-group.is-valid').length;
            let progressPercent = (validCount / totalFields) * 100;
            document.getElementById('progressBar').style.width = progressPercent + '%';

            // تحديث صندوق المعاينة الحية
            updatePreview(name.value, phone.value, city.value, pkg.value);
        }

        function toggleValidClass(element, isValid) {
            const group = element.closest('.input-group');
            if (isValid) {
                group.classList.add('is-valid');
            } else {
                group.classList.remove('is-valid');
            }
        }

        function updatePreview(name, phone, city, pkg) {
            const preview = document.getElementById('previewText');
            if (!name && !phone && !city && !pkg) {
                preview.innerText = 'في انتظار إدخال البيانات...';
                return;
            }
            preview.innerText = `العميل: ${name || '---'}\nالحديث: ${phone || '---'}\nالوجهة: ${city || '---'}\nالطلب: ${pkg || '---'}`;
        }

        /* ==========================================
           4. آلية الإرسال والاهتزاز اللمسي
           ========================================== */
        function handleSubmit() {
            const validCount = document.querySelectorAll('.input-group.is-valid').length;

            if (validCount < 4) {
                // تفعيل اهتزاز العناصر غير المكتملة
                document.querySelectorAll('.input-group').forEach(group => {
                    if (!group.classList.contains('is-valid')) {
                        group.classList.add('shake');
                        setTimeout(() => group.classList.remove('shake'), 400);
                    }
                });

                // تفعيل الاهتزاز المادي للهاتف (إن وجد)
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                return;
            }

            // إرسال ناجح وتفعيل تأثير اهتزاز النجاح
            if (navigator.vibrate) navigator.vibrate(200);
            
            const btn = document.getElementById('submitBtn');
            btn.style.background = 'var(--neon-emerald)';
            btn.style.color = '#000';
            btn.innerHTML = '<span>تم تسجيل الطلب بنجاح!</span>';

            setTimeout(() => {
                alert('تم تحويل الطلب ومعالجته في النظام بنجاح.');
            }, 300);
        }
    </script>
</body>
</html>
