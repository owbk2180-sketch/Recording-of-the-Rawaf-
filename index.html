<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة العمليات المركزية | Enterprise VIP Portal</title>
    <!-- خط Cairo عالي الدقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* 9. تخصيص لون التحديد (Selection) */
        ::selection {
            background: #22c55e;
            color: #041208;
        }

        /* 14. أشرطة التمرير المصغرة ذات التصميم الهندسي */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #05070a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #22c55e;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #05070a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 13. الخلفية الديناميكية العميقة ذات التذبذب الهادئ */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            animation: floatOrb 18s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: #22c55e; top: -120px; right: -120px; }
        .orb-2 { width: 500px; height: 500px; background: #0284c7; bottom: -180px; left: -180px; animation-delay: -7s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }

        /* الحاوية الرئيسية مع 1. تأثير توهج زجاجي متبوع بحركة المؤشر */
        .promoter-card {
            width: 100%;
            max-width: 440px;
            background: rgba(10, 14, 22, 0.9);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            padding: 36px 24px 26px 24px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }

        /* 1. مسار إضاءة المؤشر */
        .card-spotlight {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            border-radius: 24px;
            z-index: 1;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(34, 197, 94, 0.08), transparent 40%);
        }

        /* 2. شريط المؤشر الإنشائي العلوي */
        .progress-container {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            z-index: 5;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px #22c55e;
        }

        /* 3. مؤشر الاتصال الخطي الحي */
        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.02);
            padding: 5px 12px;
            border-radius: 16px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
            z-index: 2;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }
        .promoter-card:hover .brand-logo { transform: scale(1.03); }

        .title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* 9. التباعد الحرفي الهندسي للعناوين */
        .subtitle {
            font-size: 10px;
            color: #22c55e;
            font-weight: 800;
            margin-top: 4px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* تنسيق الحقول */
        .input-group {
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 5px;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* 4. حقول الإدخال ذات العمق الهندسي الداخلي */
        .input-control {
            width: 100%;
            background: rgba(4, 6, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 14px 16px;
            border-radius: 12px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            appearance: none;
        }

        .input-control:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(6, 9, 14, 0.9);
        }

        /* 5. تأثير تركيز الإطار المتدرج */
        .input-control:focus {
            border-color: #22c55e;
            background: rgba(7, 10, 16, 0.95);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .input-group:focus-within .input-label { color: #22c55e; }
        .input-control::placeholder { color: #475569; font-weight: 600; }

        /* 6. التحقق البصري الهندسي الصامت */
        .field-check {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 16px;
            height: 16px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .field-check::after {
            content: '';
            width: 4px;
            height: 8px;
            border: solid #041208;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .input-group.valid .field-check {
            transform: translateY(-50%) scale(1);
        }

        /* 7. آلية اهتزاز التنبيه الهيكلي */
        @keyframes structuralShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .input-group.shake-error .input-control {
            animation: structuralShake 0.35s ease-in-out;
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.05) !important;
        }

        /* القائمة المنسدلة */
        select.input-control {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2322c55e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: left 16px center;
            background-size: 10px;
            cursor: pointer;
            padding-left: 36px;
        }
        select.input-control option { background: #0a0e16; color: #f1f5f9; padding: 10px; }

        /* 8. شارة تصنيف مزودي الاتصالات الأوتوماتيكية */
        .phone-wrapper { position: relative; }
        .phone-input { padding-left: 85px !important; text-align: left; direction: ltr; font-size: 14px; letter-spacing: 0.8px; }
        .phone-input::placeholder { text-align: left; letter-spacing: 0; }
        
        .carrier-badge {
            position: absolute;
            left: 38px;
            top: 50%;
            transform: translateY(-50%) scale(0.85);
            font-size: 9px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            color: #fff;
            letter-spacing: 0.5px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .carrier-badge.active { opacity: 1; transform: translateY(-50%) scale(1); }
        .badge-zain { background: #7c3aed; }
        .badge-asia { background: #dc2626; }
        .badge-korek { background: #0284c7; }

        /* 10. صندوق المعاينة الهيكلي بنسق الشيفرة */
        .preview-box {
            background: rgba(3, 5, 8, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            position: relative;
            z-index: 2;
        }
        .preview-title {
            font-size: 9px;
            color: #22c55e;
            font-weight: 800;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .preview-content {
            white-space: pre-wrap;
            font-family: monospace;
            color: #cbd5e1;
            font-size: 11px;
            letter-spacing: -0.2px;
        }

        /* الأزرار */
        .actions-container {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            position: relative;
            z-index: 2;
        }

        .btn-submit {
            flex: 2;
            padding: 14px;
            background: #22c55e;
            color: #041208;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px -2px rgba(34, 197, 94, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        /* 11. تأثير اللمعان الخطي الموجه على الأزرار */
        .btn-submit::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
            transform: rotate(30deg) translateX(-100%);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .btn-submit:hover { background: #16a34a; transform: translateY(-1px); }
        .btn-submit:active { transform: scale(0.98); }

        .btn-copy {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn-copy:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }

        /* 12. تأثير التموج التفاعلي عند الضغط */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: ripple-effect 0.4s linear;
            pointer-events: none;
        }
        @keyframes ripple-effect {
            to { transform: scale(4); opacity: 0; }
        }

        .wa-icon { width: 16px; height: 16px; fill: #041208; }

        /* نظام التنبيهات العائمة */
        #toast {
            position: fixed; top: -70px; left: 50%; transform: translateX(-50%) scale(0.95);
            background: rgba(239, 68, 68, 0.95); color: #fff; padding: 10px 20px;
            border-radius: 20px; font-weight: 800; font-size: 12px; z-index: 999;
            opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); pointer-events: none;
            letter-spacing: 0.3px;
        }
        #toast.show { top: 20px; opacity: 1; transform: translateX(-50%) scale(1); }
        #toast.success { background: rgba(34, 197, 94, 0.95); box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body>

<!-- الخلفية الديناميكية العميقة -->
<div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<div id="toast"><span id="toast-msg"></span></div>

<div class="promoter-card" id="promoterCard">
    <!-- 1. تتبع مؤشر الماوس -->
    <div class="card-spotlight" id="cardSpotlight"></div>
    
    <!-- 2. شريط التقدم الهيكلي -->
    <div class="progress-container">
        <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>

    <!-- 3. مؤشر الاتصال الخطي الحي -->
    <div class="system-status">
        <div class="status-dot"></div>
        <span>SYSTEM ONLINE</span>
    </div>

    <div class="logo-container">
        <img src="my-image.png" class="brand-logo" alt="Logo">
        <h1 class="title">بوابة تسجيل البيانات</h1>
        <div class="subtitle">ENTERPRISE PORTAL</div>
    </div>

    <form id="promoterForm" novalidate>
        <!-- حقل الاسم -->
        <div class="input-group" id="groupName">
            <label class="input-label">الاسم الكامل للعميل</label>
            <div class="input-wrapper">
                <input type="text" id="customerName" class="input-control" placeholder="أدخل اسم العميل كاملاً..." required autocomplete="off">
                <div class="field-check"></div>
            </div>
        </div>

        <!-- حقل الهاتف مع مزود الخدمة -->
        <div class="input-group" id="groupPhone">
            <label class="input-label">رقم الهاتف المحمول</label>
            <div class="input-wrapper phone-wrapper">
                <input type="tel" id="phone" class="input-control phone-input" placeholder="07X XXXX XXXX" maxlength="13" required autocomplete="off">
                <div id="carrierBadge" class="carrier-badge"></div>
                <div class="field-check"></div>
            </div>
        </div>

        <!-- حقل المحافظة -->
        <div class="input-group" id="groupGov">
            <label class="input-label">المحافظة</label>
            <div class="input-wrapper">
                <select id="governorate" class="input-control" required>
                    <option value="البصرة" selected>البصرة</option>
                    <option value="بغداد">بغداد</option>
                    <option value="نينوى">نينوى</option>
                    <option value="أربيل">أربيل</option>
                    <option value="النجف">النجف</option>
                    <option value="كربلاء">كربلاء</option>
                    <option value="كركوك">كركوك</option>
                    <option value="الأنبار">الأنبار</option>
                    <option value="ديالى">ديالى</option>
                    <option value="ميسان">ميسان</option>
                    <option value="بابل">بابل</option>
                    <option value="ذي قار">ذي قار</option>
                    <option value="السليمانية">السليمانية</option>
                    <option value="دهوك">دهوك</option>
                    <option value="المثنى">المثنى</option>
                    <option value="القادسية">القادسية</option>
                    <option value="واسط">واسط</option>
                    <option value="حلبجة">حلبجة</option>
                </select>
            </div>
        </div>

        <!-- حقل المنطقة -->
        <div class="input-group" id="groupRegion">
            <label class="input-label">المنطقة أو الحي السكني</label>
            <div class="input-wrapper">
                <input type="text" id="region" class="input-control" placeholder="مثال: العشار، المنصور..." required autocomplete="off">
                <div class="field-check"></div>
            </div>
        </div>

        <!-- حقل رقم الطلب -->
        <div class="input-group" id="groupOrder">
            <label class="input-label">رقم الطلب المرجعي</label>
            <div class="input-wrapper">
                <input type="number" id="orderNumber" class="input-control" placeholder="أدخل رقم الطلب..." min="1" required autocomplete="off">
                <div class="field-check"></div>
            </div>
        </div>

        <!-- 10. صندوق المعاينة الهيكلي -->
        <div class="preview-box">
            <div class="preview-title">معاينة النظام الهيكلية</div>
            <div class="preview-content" id="livePreview">الاسم: [...]
الهاتف: [...]
العنوان: البصرة - [...]
الطلب: [...]</div>
        </div>

        <!-- الأزرار -->
        <div class="actions-container">
            <button type="button" class="btn-copy" id="copyBtn">نسخ البيانات</button>
            <button type="submit" class="btn-submit">
                <svg class="wa-icon" viewBox="0 0 24 24">
                    <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.758.459 3.474 1.33 4.982L2 22l5.122-1.334c1.455.793 3.097 1.21 4.885 1.211h.005c5.507 0 9.99-4.478 9.99-9.985 0-2.667-1.039-5.174-2.928-7.062A9.917 9.917 0 0 0 12.012 2zm5.836 14.129c-.244.688-1.417 1.314-1.982 1.398-.506.076-1.148.107-1.853-.117-.427-.135-.975-.317-1.677-.621-2.951-1.275-4.88-4.246-5.027-4.442-.146-.196-1.196-1.595-1.196-3.044 0-1.448.762-2.158 1.03-2.453.27-.295.588-.368.784-.368.196 0 .392.001.564.01.18.009.423-.068.663.505.244.588.833 2.037.906 2.185.073.147.122.319.025.515-.098.196-.147.319-.294.491-.147.172-.31.385-.442.516-.147.147-.3.308-.129.602.172.294.762 1.251 1.636 2.03 1.123.998 2.07 1.308 2.364 1.455.294.147.466.123.637-.073.172-.196.735-.858.931-1.152.196-.295.392-.245.686-.147.294.098 1.861.877 2.18 1.036.319.159.53.235.603.358.073.123.073.712-.171 1.401z"/>
                </svg>
                <span>إرسال فوري</span>
            </button>
        </div>
    </form>
</div>

<script>
    /* 1. تتبع المؤشر داخل البطاقة */
    const card = document.getElementById('promoterCard');
    card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
    });

    /* 12. تأثير التموج عند الضغط */
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const circle = document.createElement('span');
            const diameter = Math.max(this.clientWidth, this.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - this.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${e.clientY - this.getBoundingClientRect().top - radius}px`;
            circle.classList.add('ripple');
            const existingRipple = this.getElementsByClassName('ripple')[0];
            if (existingRipple) existingRipple.remove();
            this.appendChild(circle);
        });
    });

    function showToast(message, isSuccess = false) {
        if (navigator.vibrate) navigator.vibrate(30);
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-msg');
        msg.innerText = message;
        toast.className = isSuccess ? 'show success' : 'show';
        setTimeout(() => toast.className = '', 2800);
    }

    /* 7. تفعيل اهتزاز الخطأ الهيكلي */
    function triggerStructuralShake(elementId) {
        const group = document.getElementById(elementId);
        group.classList.add('shake-error');
        if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
        setTimeout(() => group.classList.remove('shake-error'), 350);
    }

    const nameInput = document.getElementById('customerName');
    const phoneInput = document.getElementById('phone');
    const govSelect = document.getElementById('governorate');
    const regionInput = document.getElementById('region');
    const orderInput = document.getElementById('orderNumber');
    const carrierBadge = document.getElementById('carrierBadge');
    const livePreview = document.getElementById('livePreview');

    /* 15. استرجاع المسودة الفورية من الذاكرة المحلية */
    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('ent_name')) nameInput.value = localStorage.getItem('ent_name');
        if(localStorage.getItem('ent_phone')) phoneInput.value = localStorage.getItem('ent_phone');
        if(localStorage.getItem('ent_gov')) govSelect.value = localStorage.getItem('ent_gov');
        if(localStorage.getItem('ent_region')) regionInput.value = localStorage.getItem('ent_region');
        if(localStorage.getItem('ent_order')) orderInput.value = localStorage.getItem('ent_order');
        updateSystemState();
    });

    function updateSystemState() {
        const name = nameInput.value.trim();
        const phone = phoneInput.value.replace(/\s/g, '');
        const gov = govSelect.value;
        const region = regionInput.value.trim();
        const orderNum = orderInput.value.trim();

        document.getElementById('groupName').classList.toggle('valid', name.length > 1);
        document.getElementById('groupPhone').classList.toggle('valid', phone.length === 11);
        document.getElementById('groupGov').classList.toggle('valid', gov.length > 0);
        document.getElementById('groupRegion').classList.toggle('valid', region.length > 1);
        document.getElementById('groupOrder').classList.toggle('valid', orderNum.length > 0);

        /* 2. تحديث شريط المؤشر الإنشائي */
        let filledCount = 0;
        if (name.length > 1) filledCount++;
        if (phone.length === 11) filledCount++;
        if (region.length > 1) filledCount++;
        if (orderNum.length > 0) filledCount++;
        document.getElementById('progressBarFill').style.width = `${(filledCount / 4) * 100}%`;

        /* 15. الحفظ التلقائي في الذاكرة */
        localStorage.setItem('ent_name', name);
        localStorage.setItem('ent_phone', phoneInput.value);
        localStorage.setItem('ent_gov', gov);
        localStorage.setItem('ent_region', region);
        localStorage.setItem('ent_order', orderNum);

        /* 10. تحديث المعاينة الهيكلية */
        livePreview.innerText = `الاسم: ${name || '[...]'}\nالهاتف: ${phoneInput.value || '[...]'}\nالعنوان: ${gov} - ${region || '[...]'}\nالطلب: ${orderNum || '[...]'}`;
    }

    /* 8. تحديد مزود الاتصالات آلياً وتنسيق الرقم */
    phoneInput.addEventListener('input', function() {
        let val = this.value.replace(/\D/g, ''); 
        carrierBadge.className = 'carrier-badge';
        
        if (val.startsWith('078') || val.startsWith('079')) {
            carrierBadge.innerText = 'ZAIN'; 
            carrierBadge.classList.add('badge-zain', 'active');
        } else if (val.startsWith('077')) {
            carrierBadge.innerText = 'ASIA'; 
            carrierBadge.classList.add('badge-asia', 'active');
        } else if (val.startsWith('075')) {
            carrierBadge.innerText = 'KOREK'; 
            carrierBadge.classList.add('badge-korek', 'active');
        } else {
            carrierBadge.classList.remove('active');
        }

        let formatted = val;
        if (val.length > 4) formatted = val.slice(0, 4) + ' ' + val.slice(4);
        if (val.length > 7) formatted = val.slice(0, 4) + ' ' + val.slice(4, 7) + ' ' + val.slice(7, 11);
        this.value = formatted;
        updateSystemState();
    });

    [nameInput, govSelect, regionInput, orderInput].forEach(el => {
        el.addEventListener('input', updateSystemState);
        el.addEventListener('change', updateSystemState);
    });

    /* زر النسخ السريع */
    document.getElementById('copyBtn').addEventListener('click', function() {
        const textToCopy = livePreview.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast("تم نسخ البيانات بنجاح", true);
        });
    });

    /* معالجة تقديم الطلب والإرسال */
    document.getElementById('promoterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = nameInput.value.trim();
        const phone = phoneInput.value.replace(/\s/g, ''); 
        const gov = govSelect.value;
        const region = regionInput.value.trim();
        const orderNum = orderInput.value.trim();

        if (!name) { 
            triggerStructuralShake('groupName');
            showToast("خطأ: يرجى إدخال اسم العميل"); 
            return; 
        }
        if (phone.length !== 11) { 
            triggerStructuralShake('groupPhone');
            showToast("خطأ: رقم الهاتف غير متكامل (11 رقماً مطلوب)"); 
            return; 
        }
        if (!region) { 
            triggerStructuralShake('groupRegion');
            showToast("خطأ: يرجى تحديد المنطقة أو الحي السكني"); 
            return; 
        }
        if (!orderNum) { 
            triggerStructuralShake('groupOrder');
            showToast("خطأ: يرجى إدخال رقم الطلب المرجعي"); 
            return; 
        }

        const targetWhatsAppNumber = "9647888988288"; 
        const messageText = `الاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${gov} - ${region}\nالطلب: ${orderNum}`;
        const encodedMsg = encodeURIComponent(messageText);

        window.location.href = `whatsapp://send?phone=${targetWhatsAppNumber}&text=${encodedMsg}`;

        setTimeout(() => {
            localStorage.clear();
            document.getElementById('promoterForm').reset();
            carrierBadge.className = 'carrier-badge';
            updateSystemState();
        }, 1000);
    });
</script>
</body>
</html>
