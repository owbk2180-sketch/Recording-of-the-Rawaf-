<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة التسجيل الاحترافية</title>
    <!-- خط Cairo عالي الدقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #040406;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(142, 68, 173, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 50%, rgba(41, 128, 185, 0.1) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* الحاوية الرئيسية */
        .promoter-card {
            width: 100%;
            max-width: 440px;
            background: rgba(13, 14, 18, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 25px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
        }

        /* شريط الإضاءة العلوي */
        .promoter-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 3px;
            background: linear-gradient(90deg, #8E44AD, #E74C3C, #00E676, #2980B9);
            border-radius: 0 0 5px 5px;
            box-shadow: 0 2px 12px rgba(0, 230, 118, 0.5);
        }

        /* الشعار والعنوان */
        .logo-container {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.25);
            margin-bottom: 12px;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 12px;
            color: #00E676;
            font-weight: 800;
            margin-top: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* تنسيق الحقول */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: #9a9a9a;
            margin-bottom: 8px;
        }

        .input-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.55);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 16px 18px;
            border-radius: 16px;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
        }

        .input-control:focus {
            border-color: #00E676;
            background: rgba(0, 230, 118, 0.03);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
        }

        .input-control::placeholder { color: #444; font-weight: 600; }

        /* القائمة المنسدلة للمحافظات */
        select.input-control {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300E676%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: left 18px center;
            background-size: 13px;
            cursor: pointer;
        }
        select.input-control option { background: #121318; color: #fff; padding: 14px; font-weight: 700; }

        /* شارة شركات الاتصال */
        .phone-wrapper { position: relative; }
        .phone-input { padding-left: 95px; text-align: left; direction: ltr; font-size: 16px; letter-spacing: 1px; }
        .phone-input::placeholder { text-align: left; letter-spacing: 0; }
        
        .carrier-badge {
            position: absolute;
            left: 10px;
            top: 43px;
            font-size: 12px;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            color: #fff;
        }

        .badge-zain { background: #8E44AD !important; border: 1px solid #9B59B6; opacity: 1; box-shadow: 0 0 12px rgba(142,68,173,0.5); }
        .badge-asia { background: #E74C3C !important; border: 1px solid #FF6B6B; opacity: 1; box-shadow: 0 0 12px rgba(231,76,60,0.5); }
        .badge-korek { background: #2980B9 !important; border: 1px solid #5DADE2; opacity: 1; box-shadow: 0 0 12px rgba(41,128,185,0.5); }

        /* زر الإرسال مع أيقونة واتساب فخمة وبارزة */
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00E676 0%, #00B0FF 100%);
            color: #040406;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 12px 30px rgba(0, 230, 118, 0.35);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .btn-submit:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 18px 40px rgba(0, 230, 118, 0.5); 
        }

        .wa-icon {
            width: 28px;
            height: 28px;
            fill: #040406;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* رسالة التنبيه العائمة */
        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.95); color: #fff; padding: 12px 28px;
            border-radius: 30px; font-weight: 800; font-size: 14px; z-index: 999;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }
        #toast.show { top: 25px; }
    </style>
</head>
<body>

<div id="toast"><span id="toast-msg"></span></div>

<div class="promoter-card">
    <div class="logo-container">
        <img src="my-image.png" class="brand-logo" alt="Logo">
        <h1 class="title">تسجيل العملاء</h1>
        <div class="subtitle">PROMOTER SYSTEM VIP</div>
    </div>

    <form id="promoterForm">
        <!-- الاسم الكامل -->
        <div class="input-group">
            <label class="input-label">الاسم الكامل للزبون</label>
            <input type="text" id="customerName" class="input-control" placeholder="اكتب اسم الزبون..." required autocomplete="off">
        </div>

        <!-- رقم الهاتف -->
        <div class="input-group phone-wrapper">
            <label class="input-label">رقم الهاتف</label>
            <input type="tel" id="phone" class="input-control phone-input" placeholder="07X XXXX XXXX" maxlength="13" required autocomplete="off">
            <div id="carrierBadge" class="carrier-badge"></div>
        </div>

        <!-- المحافظة -->
        <div class="input-group">
            <label class="input-label">المحافظة</label>
            <select id="governorate" class="input-control" required>
                <option value="البصرة" selected>البصرة</option>
                <option value="بغداد">بغداد</option>
                <option value="نينوى">نينوى</option>
                <option value="أربيل">أربيل</option>
                <option value="النجف">النجف</option>
                <option value="كربلاء">كربلاء</option>
                <option value="كركوك">كركوك</option>
                <option value="الأنبار">الأنبار</option>
                <option value="ديالى">ديالى</option>
                <option value="ميسان">ميسان</option>
                <option value="بابل">بابل</option>
                <option value="ذي قار">ذي قار</option>
                <option value="السليمانية">السليمانية</option>
                <option value="دهوك">دهوك</option>
                <option value="المثنى">المثنى</option>
                <option value="القادسية">القادسية</option>
                <option value="واسط">واسط</option>
                <option value="حلبجة">حلبجة</option>
            </select>
        </div>

        <!-- المنطقة -->
        <div class="input-group">
            <label class="input-label">اسم المنطقة / الحي</label>
            <input type="text" id="region" class="input-control" placeholder="مثال: العشار، المنصور..." required autocomplete="off">
        </div>

        <!-- رقم الطلب (خانة حرة يكتبها الزبون تماماً كما طلب) -->
        <div class="input-group">
            <label class="input-label">رقم الطلب</label>
            <input type="number" id="orderNumber" class="input-control" placeholder="اكتب رقم الطلب هنا..." min="1" required autocomplete="off">
        </div>

        <!-- زر الإرسال -->
        <button type="submit" class="btn-submit">
            <span>تحويل الطلب إلى الواتساب</span>
            <svg class="wa-icon" viewBox="0 0 24 24">
                <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.758.459 3.474 1.33 4.982L2 22l5.122-1.334c1.455.793 3.097 1.21 4.885 1.211h.005c5.507 0 9.99-4.478 9.99-9.985 0-2.667-1.039-5.174-2.928-7.062A9.917 9.917 0 0 0 12.012 2zm5.836 14.129c-.244.688-1.417 1.314-1.982 1.398-.506.076-1.148.107-1.853-.117-.427-.135-.975-.317-1.677-.621-2.951-1.275-4.88-4.246-5.027-4.442-.146-.196-1.196-1.595-1.196-3.044 0-1.448.762-2.158 1.03-2.453.27-.295.588-.368.784-.368.196 0 .392.001.564.01.18.009.423-.068.663.505.244.588.833 2.037.906 2.185.073.147.122.319.025.515-.098.196-.147.319-.294.491-.147.172-.31.385-.442.516-.147.147-.3.308-.129.602.172.294.762 1.251 1.636 2.03 1.123.998 2.07 1.308 2.364 1.455.294.147.466.123.637-.073.172-.196.735-.858.931-1.152.196-.295.392-.245.686-.147.294.098 1.861.877 2.18 1.036.319.159.53.235.603.358.073.123.073.712-.171 1.401z"/>
            </svg>
        </button>
    </form>
</div>

<script>
    function showToast(message) {
        if(navigator.vibrate) navigator.vibrate(50);
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    const phoneInput = document.getElementById('phone');
    const carrierBadge = document.getElementById('carrierBadge');

    // كشف شبكة الاتصال
    phoneInput.addEventListener('input', function() {
        let val = this.value.replace(/\D/g, ''); 
        carrierBadge.className = 'carrier-badge';
        
        if (val.startsWith('078') || val.startsWith('079')) {
            carrierBadge.innerText = 'زين'; 
            carrierBadge.classList.add('badge-zain');
        } else if (val.startsWith('077')) {
            carrierBadge.innerText = 'آسيا'; 
            carrierBadge.classList.add('badge-asia');
        } else if (val.startsWith('075')) {
            carrierBadge.innerText = 'كورك'; 
            carrierBadge.classList.add('badge-korek');
        } else {
            carrierBadge.innerText = '';
        }

        let formatted = val;
        if (val.length > 4) formatted = val.slice(0, 4) + ' ' + val.slice(4);
        if (val.length > 7) formatted = val.slice(0, 4) + ' ' + val.slice(4, 7) + ' ' + val.slice(7, 11);
        this.value = formatted;
    });

    document.getElementById('promoterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('customerName').value.trim();
        const phone = phoneInput.value.replace(/\s/g, ''); 
        const gov = document.getElementById('governorate').value;
        const region = document.getElementById('region').value.trim();
        const orderNum = document.getElementById('orderNumber').value.trim();

        if (phone.length !== 11) { 
            showToast("⚠️ الرجاء التأكد من كتابة 11 رقماً لرقم الهاتف"); 
            return; 
        }

        if(navigator.vibrate) navigator.vibrate(40);

        const targetWhatsAppNumber = "9647888988288"; 
        
        // رسالة الواتساب بالصيغة المطلوبة بالحرف الواحد
        const messageText = `👤 الاسم الكامل: ${name}\n\n📞 رقم الهاتف الأساسي: ${phone}\n\n📍 العنوان بالتفصيل:\n(${gov}  -  ${region})\n\nرقم طلب  : ${orderNum}`;
        
        const waLink = `https://wa.me/${targetWhatsAppNumber}?text=${encodeURIComponent(messageText)}`;

        // التوجيه إلى الواتساب
        window.location.href = waLink;
        
        // تفريغ الحقول بعد الإرسال
        setTimeout(() => {
            document.getElementById('customerName').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('region').value = '';
            document.getElementById('orderNumber').value = '';
            carrierBadge.className = 'carrier-badge';
        }, 1000);
    });
</script>
</body>
</html>
