<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل البيانات السريعة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.9); }
        }
        .animate-glow-pulse {
            animation: glowPulse 2s infinite;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-1 { animation: fadeInUp 0.4s ease forwards 0.05s; opacity: 0; }
        .stagger-2 { animation: fadeInUp 0.4s ease forwards 0.10s; opacity: 0; }
        .stagger-3 { animation: fadeInUp 0.4s ease forwards 0.15s; opacity: 0; }
        .stagger-4 { animation: fadeInUp 0.4s ease forwards 0.20s; opacity: 0; }
        
        /* إيقاف الخلفية المتحركة للأجهزة الضعيفة */
        .no-motion * {
            animation: none !important;
            transition: none !important;
        }
    </style>
</head>
<body id="bodyRoot" class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- خلفية الـ Orbs المتحركة (نقطة 10) -->
    <div id="bgOrbs" class="absolute inset-0 overflow-hidden pointer-events-none opacity-30">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-purple-600 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <!-- بطاقة الاستمارة الرئيسية -->
    <div class="relative z-10 w-full max-w-2xl bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
        
        <!-- رأس الاستمارة مع زر إعادة التعيين (نقطة 14) وتبديل الأداء (نقطة 10) -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span>⚡ بوابة تسجيل البيانات</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">أدخل بياناتك بدقة وسرعة فائقة</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- زر إيقاف الحركة للأجهزة الضعيفة -->
                <button onclick="toggleMotion()" id="motionBtn" title="تخفيف الحركة والبطارية" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">
                    🔋 الأداء
                </button>
                <!-- زر إعادة تعيين المسودة -->
                <button onclick="resetDraft()" title="إعادة تعيين الاستمارة" class="p-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs transition flex items-center gap-1">
                    🗑️ مسح
                </button>
            </div>
        </div>

        <!-- شريط التقدم -->
        <div class="mb-6">
            <div class="flex justify-between text-xs text-slate-400 mb-1.5">
                <span>اكتمال الاستمارة</span>
                <span id="progressText">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <!-- الاستمارة بتقسيم عمودين للشاشات العريضة (نقطة 7) -->
        <form id="registrationForm" class="space-y-4" onsubmit="event.preventDefault();">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- حقل الاسم (مع زر مسح سريع - نقطة 4) و(حركة ظهور - نقطة 13) -->
                <div class="space-y-1.5 stagger-1 relative">
                    <label class="text-xs font-medium text-slate-300">الاسم الكامل</label>
                    <div class="relative">
                        <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" 
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition pr-4 pl-10"
                            oninput="checkField('fullName'); updateProgress();">
                        <!-- زر مسح سريع -->
                        <button type="button" onclick="clearInput('fullName')" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white text-xs hidden clear-btn">✕</button>
                    </div>
                </div>

                <!-- حقل رقم الهاتف مع لوحة أرقام (نقطة 2)، لصق ذكي (نقطة 6)، وحالة التحقق (نقطة 15) -->
                <div class="space-y-1.5 stagger-2 relative">
                    <label class="text-xs font-medium text-slate-300">رقم الهاتف</label>
                    <div class="relative flex items-center">
                        <input type="tel" id="phone" inputmode="numeric" placeholder="07xxxxxxxx" 
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition pr-4 pl-20"
                            oninput="formatPhone(this); updateProgress();">
                        <!-- زر لصق ذكي وتنظيف -->
                        <button type="button" onclick="smartPastePhone()" class="absolute left-9 top-1/2 -translate-y-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg text-[10px] transition">لصق</button>
                        <button type="button" onclick="clearInput('phone')" class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white text-xs hidden clear-btn">✕</button>
                    </div>
                </div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- حقل المحافظة (يفتح نافذة البحث السريع - نقطة 1) -->
                <div class="space-y-1.5 stagger-3 relative">
                    <label class="text-xs font-medium text-slate-300">المحافظة</label>
                    <div class="relative">
                        <input type="text" id="province" readonly onclick="openProvinceModal()" placeholder="اختر المحافظة..." 
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white cursor-pointer focus:outline-none focus:border-emerald-500 transition">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none">▼</span>
                    </div>
                </div>

                <!-- حقل رقم الطلب مع زوائد زيادة وتناقص تلقائي (نقطة 9) -->
                <div class="space-y-1.5 stagger-4 relative">
                    <label class="text-xs font-medium text-slate-300">رقم الطلب</label>
                    <div class="relative flex items-center">
                        <input type="text" id="orderNo" value="ORD-9024" readonly
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
                        <div class="absolute left-2 flex items-center gap-1">
                            <button type="button" onclick="adjustOrder(-1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs flex items-center justify-center">-</button>
                            <button type="button" onclick="adjustOrder(1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs flex items-center justify-center">+</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- اقتراحات المناطق الشائعة (نقطة 5) -->
            <div id="regionChipsContainer" class="space-y-1.5 hidden">
                <label class="text-xs font-medium text-slate-400">المناطق الشائعة في المحافظة:</label>
                <div class="flex flex-wrap gap-2" id="chipsList">
                    <!-- يتم تعبئتها ديناميكياً -->
                </div>
            </div>

            <!-- شعارات شركات الاتصالات المضيئة (نقطة 11) -->
            <div class="pt-2">
                <label class="text-xs font-medium text-slate-400 mb-2 block">الشبكة المستخدمة:</label>
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" onclick="selectCarrier('Zain', this)" class="carrier-badge p-2.5 rounded-xl border border-slate-800 bg-slate-950/40 text-center text-xs font-medium transition hover:border-amber-500/50">زين العراق</button>
                    <button type="button" onclick="selectCarrier('AsiaCell', this)" class="carrier-badge p-2.5 rounded-xl border border-slate-800 bg-slate-950/40 text-center text-xs font-medium transition hover:border-amber-500/50">آسياسيل</button>
                    <button type="button" onclick="selectCarrier('Korek', this)" class="carrier-badge p-2.5 rounded-xl border border-slate-800 bg-slate-950/40 text-center text-xs font-medium transition hover:border-amber-500/50">كورك</button>
                </div>
            </div>

            <!-- طي ومعاينة رسالة الواتساب (نقطة 12) -->
            <div class="border border-slate-800 rounded-2xl bg-slate-950/40 overflow-hidden mt-4">
                <button type="button" onclick="toggleWhatsAppPreview()" class="w-full p-3.5 flex items-center justify-between text-xs font-medium text-slate-300 hover:bg-slate-900/50 transition">
                    <span class="flex items-center gap-2">📱 معاينة رسالة الواتساب الجاهزة</span>
                    <span id="waArrow" class="transform transition-transform">▼</span>
                </button>
                <div id="waPreviewBody" class="hidden p-3.5 pt-0 text-xs text-slate-400 border-t border-slate-800/50 bg-slate-950/80 leading-relaxed font-mono">
                    مرحباً، أود تسجيل البيانات للطلب رقم <span id="waOrder">ORD-9024</span> باسم <span id="waName">...</span> ورقم الهاتف <span id="waPhone">...</span>.
                </div>
            </div>

            <!-- زر الإرسال مع التوهج النبضي عند 100% (نقطة 3) وإشعار نسخ مباشر (نقطة 8) -->
            <div class="pt-2">
                <button type="button" id="submitBtn" onclick="submitData()" 
                    class="w-full py-3.5 rounded-xl bg-slate-800 text-slate-400 font-bold text-sm transition flex items-center justify-center gap-2 cursor-not-allowed">
                    <span id="btnText">أكمل الحقول للإرسال الفوري</span>
                </button>
            </div>

        </form>
    </div>

    <!-- نافذة البحث السريع للمحافظات (نقطة 1) -->
    <div id="provinceModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-white">اختر المحافظة</h3>
                <button onclick="closeProvinceModal()" class="text-slate-400 hover:text-white text-sm px-2 py-1">✕</button>
            </div>
            <!-- حقل بحث زجاجي داخل النافذة -->
            <input type="text" id="provinceSearch" oninput="filterProvinces()" placeholder="ابحث عن المحافظة فوراً..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            <div id="provincesList" class="max-h-60 overflow-y-auto space-y-1 pr-1">
                <!-- يتم تعبئتها برمجياً -->
            </div>
        </div>
    </div>

    <script>
        const provincesData = {
            "البصرة": ["العشار", "الجزائر", "الطويسة", "المعقل", "الجنينة", "البربدعية"],
            "بغداد": ["الكرادة", "الجادرية", "المنصور", "الأعظمية", "الكاظمية", "حي الصليخ"],
            "أربيل": ["عنكاوا", "المدينة القديمة", "باختياري", "سوارة توكل"],
            "النجف": ["المدينة القديمة", "الحدث", "الغراف", "الجزيرة"],
            "السليمانية": ["السركار", "بران", "القرية الألمانية"],
            "نينوى": ["الموصل العتيقة", "الزهور", "السكر", "المهندسين"]
        };

        let selectedCarrierValue = "";

        // تهيئة قائمة المحافظات
        function loadProvinces(filter = "") {
            const list = document.getElementById('provincesList');
            list.innerHTML = "";
            Object.keys(provincesData).forEach(prov => {
                if(prov.includes(filter)) {
                    const div = document.createElement('div');
                    div.className = "p-3 rounded-xl hover:bg-slate-800 cursor-pointer text-xs text-slate-200 transition flex items-center justify-between";
                    div.innerHTML = `<span>${prov}</span> <span class="text-[10px] text-slate-500">اختيار</span>`;
                    div.onclick = () => selectProvince(prov);
                    list.appendChild(div);
                }
            });
        }

        function openProvinceModal() {
            document.getElementById('provinceModal').classList.remove('hidden');
            loadProvinces();
            document.getElementById('provinceSearch').focus();
        }

        function closeProvinceModal() {
            document.getElementById('provinceModal').classList.add('hidden');
        }

        function filterProvinces() {
            const val = document.getElementById('provinceSearch').value;
            loadProvinces(val);
        }

        function selectProvince(prov) {
            document.getElementById('province').value = prov;
            closeProvinceModal();
            checkField('province');
            updateProgress();
            
            // إظهار اقتراحات المناطق الشائعة (نقطة 5)
            const chipsContainer = document.getElementById('regionChipsContainer');
            const chipsList = document.getElementById('chipsList');
            chipsList.innerHTML = "";
            if(provincesData[prov]) {
                chipsContainer.classList.remove('hidden');
                provincesData[prov].forEach(region => {
                    const chip = document.createElement('button');
                    chip.type = "button";
                    chip.className = "px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 text-xs hover:border-emerald-500 hover:text-white transition";
                    chip.innerText = region;
                    chip.onclick = () => {
                        // تحديد المنطقة
                        document.querySelectorAll('#chipsList button').forEach(b => b.classList.remove('bg-emerald-600', 'border-emerald-500', 'text-white'));
                        chip.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
                        updateProgress();
                    };
                    chipsList.appendChild(chip);
                });
            } else {
                chipsContainer.classList.add('hidden');
            }
        }

        // تنسيق وفحص الهاتف (نقطة 2 و 15)
        function formatPhone(input) {
            let val = input.value.replace(/\D/g, '');
            if(val.length > 11) val = val.substring(0, 11);
            input.value = val;
            
            checkField('phone');
            if(val.length === 11) {
                input.classList.remove('border-slate-800', 'border-rose-500');
                input.classList.add('border-emerald-500'); // نقطة 15: حدود ملونة لحالة التحقق
            } else {
                input.classList.remove('border-emerald-500');
                input.classList.add('border-slate-800');
            }
            document.getElementById('waPhone').innerText = val || "...";
        }

        // لصق ذكي وتنظيف الهاتف (نقطة 6)
        async function smartPastePhone() {
            try {
                const text = await navigator.clipboard.readText();
                let cleanText = text.replace(/\D/g, '');
                if(cleanText.startsWith('964')) {
                    cleanText = '0' + cleanText.substring(3);
                }
                if(cleanText.length > 11) cleanText = cleanText.substring(0, 11);
                const phoneInput = document.getElementById('phone');
                phoneInput.value = cleanText;
                formatPhone(phoneInput);
                updateProgress();
            } catch (err) {
                alert('عذراً، يرجى السماح بصلاحية قراءة الحافظة أو اللصق اليدوي.');
            }
        }

        function checkField(id) {
            const val = document.getElementById(id).value;
            const clearBtn = document.getElementById(id).parentElement.querySelector('.clear-btn');
            if(clearBtn) {
                if(val.length > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            if(id === 'fullName') document.getElementById('waName').innerText = val || "...";
        }

        function clearInput(id) {
            const el = document.getElementById(id);
            el.value = "";
            checkField(id);
            if(id === 'phone') {
                el.classList.remove('border-emerald-500');
                document.getElementById('waPhone').innerText = "...";
            }
            updateProgress();
        }

        // زوائد رقم الطلب (نقطة 9)
        let currentOrderNum = 9024;
        function adjustOrder(amount) {
            currentOrderNum += amount;
            if(currentOrderNum < 1) currentOrderNum = 1;
            const formatted = `ORD-${currentOrderNum}`;
            document.getElementById('orderNo').value = formatted;
            document.getElementById('waOrder').innerText = formatted;
        }

        // اختيار شبكة الاتصالات مع توهج البراند (نقطة 11)
        function selectCarrier(carrier, btn) {
            document.querySelectorAll('.carrier-badge').forEach(b => {
                b.classList.remove('bg-emerald-500/10', 'border-emerald-500', 'text-emerald-400');
                b.classList.add('bg-slate-950/40', 'border-slate-800', 'text-slate-300');
            });
            btn.classList.remove('bg-slate-950/40', 'border-slate-800', 'text-slate-300');
            btn.classList.add('bg-emerald-500/10', 'border-emerald-500', 'text-emerald-400');
            selectedCarrierValue = carrier;
            updateProgress();
        }

        // حساب نسبة التقدم وتفعيل الزر النبضي (نقطة 3)
        function updateProgress() {
            let score = 0;
            if(document.getElementById('fullName').value.trim() !== "") score += 25;
            if(document.getElementById('phone').value.length === 11) score += 25;
            if(document.getElementById('province').value.trim() !== "") score += 25;
            if(selectedCarrierValue !== "") score += 25;

            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            progressBar.style.width = score + "%";
            progressText.innerText = score + "%";

            if(score === 100) {
                submitBtn.className = "w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition flex items-center justify-center gap-2 cursor-pointer animate-glow-pulse";
                btnText.innerText = "🚀 إرسال فوري";
            } else {
                submitBtn.className = "w-full py-3.5 rounded-xl bg-slate-800 text-slate-400 font-bold text-sm transition flex items-center justify-center gap-2 cursor-not-allowed";
                btnText.innerText = "أكمل الحقول للإرسال الفوري";
            }
        }

        // إشعار نسخ وتحديث الزر مؤقتاً (نقطة 8)
        function submitData() {
            let score = 0;
            if(document.getElementById('fullName').value.trim() !== "") score += 25;
            if(document.getElementById('phone').value.length === 11) score += 25;
            if(document.getElementById('province').value.trim() !== "") score += 25;
            if(selectedCarrierValue !== "") score += 25;

            if(score < 100) {
                alert('يرجى إكمال كافة الحقول المطلوبة واختيار الشبكة.');
                return;
            }

            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerText;
            
            // تغيير نص وزر الإرسال مؤقتاً (إشعار inline بدل Toast)
            btnText.innerText = "✔ تم الإرسال بنجاح!";
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.remove('bg-emerald-600', 'animate-glow-pulse');
            submitBtn.classList.add('bg-blue-600');

            setTimeout(() => {
                btnText.innerText = originalText;
                submitBtn.classList.remove('bg-blue-600');
                submitBtn.classList.add('bg-emerald-600', 'animate-glow-pulse');
            }, 2000);
        }

        // طي ومعاينة رسالة الواتساب (نقطة 12)
        function toggleWhatsAppPreview() {
            const body = document.getElementById('waPreviewBody');
            const arrow = document.getElementById('waArrow');
            body.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }

        // إيقاف الحركة للأجهزة الضعيفة (نقطة 10)
        function toggleMotion() {
            const root = document.getElementById('bodyRoot');
            const orbs = document.getElementById('bgOrbs');
            root.classList.toggle('no-motion');
            orbs.classList.toggle('hidden');
            const btn = document.getElementById('motionBtn');
            if(root.classList.contains('no-motion')) {
                btn.innerText = "✨ تشغيل الحركة";
                btn.classList.add('bg-emerald-500/20', 'text-emerald-400');
            } else {
                btn.innerText = "🔋 الأداء";
                btn.classList.remove('bg-emerald-500/20', 'text-emerald-400');
            }
        }

        // إعادة تعيين المسودة (نقطة 14)
        function resetDraft() {
            if(confirm('هل أنت متأكد من مسح جميع البيانات وإعادة الاستمارة للصفر؟')) {
                document.getElementById('registrationForm').reset();
                document.querySelectorAll('.clear-btn').forEach(b => b.classList.add('hidden'));
                document.querySelectorAll('.carrier-badge').forEach(b => {
                    b.classList.remove('bg-emerald-500/10', 'border-emerald-500', 'text-emerald-400');
                    b.classList.add('bg-slate-950/40', 'border-slate-800', 'text-slate-300');
                });
                document.getElementById('regionChipsContainer').classList.add('hidden');
                selectedCarrierValue = "";
                const phoneInput = document.getElementById('phone');
                phoneInput.classList.remove('border-emerald-500');
                phoneInput.classList.add('border-slate-800');
                document.getElementById('waName').innerText = "...";
                document.getElementById('waPhone').innerText = "...";
                updateProgress();
            }
        }
    </script>
</body>
</html>
