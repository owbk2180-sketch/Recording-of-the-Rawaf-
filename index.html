<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة التسجيل الرسمية | VIP Portal</title>
    <!-- خط Cairo عالي الدقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #06080d;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(37, 211, 102, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(15, 20, 30, 0.9) 0%, transparent 50%);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .promoter-card {
            width: 100%;
            max-width: 440px;
            background: rgba(11, 14, 20, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 34px 24px;
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            transform: translateZ(0);
        }

        /* شريط علوي رسمي دقيق */
        .promoter-card::before {
            content: '';
            position: absolute;
            top: 0; left: 25%; right: 25%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(37, 211, 102, 0.5), transparent);
        }

        /* مؤشر حالة النظام المباشر */
        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(37, 211, 102, 0.3);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.15);
            margin-bottom: 12px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .promoter-card:hover .brand-logo { transform: scale(1.03); }

        .title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
        }

        .subtitle {
            font-size: 10px;
            color: #25D366;
            font-weight: 800;
            margin-top: 2px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* تنسيق الحقول */
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-control {
            width: 100%;
            background: rgba(5, 7, 11, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 15px 18px;
            border-radius: 14px;
            outline: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            appearance: none;
        }

        .input-control:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(7, 10, 15, 0.9);
        }

        .input-control:focus {
            border-color: #25D366;
            background: rgba(8, 12, 18, 0.95);
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.12);
        }

        .input-group:focus-within .input-label { color: #25D366; }
        .input-control::placeholder { color: #475569; font-weight: 600; }

        /* علامة الصح التفاعلية داخل الحقل عند الصحة */
        .field-check {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 18px;
            height: 18px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .field-check::after {
            content: '✓';
            color: #000;
            font-size: 10px;
            font-weight: 900;
        }
        .input-group.valid .field-check {
            transform: translateY(-50%) scale(1);
        }

        /* القائمة المنسدلة */
        select.input-control {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2325D366%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: left 18px center;
            background-size: 11px;
            cursor: pointer;
        }
        select.input-control option { background: #0c1017; color: #f1f5f9; padding: 12px; }

        /* شارة الشركات السلسة */
        .phone-wrapper { position: relative; }
        .phone-input { padding-left: 90px; text-align: left; direction: ltr; font-size: 15px; letter-spacing: 1px; }
        .phone-input::placeholder { text-align: left; letter-spacing: 0; }
        
        .carrier-badge {
            position: absolute;
            left: 42px;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            font-size: 10px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .carrier-badge.active { opacity: 1; transform: translateY(-50%) scale(1); }
        .badge-zain { background: #7c3aed; }
        .badge-asia { background: #dc2626; }
        .badge-korek { background: #0284c7; }

        /* بطاقة المعاينة المباشرة (Live Preview Box) */
        .preview-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .preview-title {
            font-size: 10px;
            color: #25D366;
            font-weight: 800;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .preview-content {
            white-space: pre-wrap;
            font-family: monospace;
            color: #e2e8f0;
            font-size: 12px;
        }

        /* الأزرار (إرسال + نسخ) */
        .actions-container {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn-submit {
            flex: 2;
            padding: 15px;
            background: #25D366;
            color: #041208;
            border: none;
            border-radius: 13px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px -3px rgba(37, 211, 102, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover { background: #22c55e; transform: translateY(-1px); }
        .btn-submit:active { transform: scale(0.98); }

        .btn-copy {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .btn-copy:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.2); }

        .wa-icon { width: 18px; height: 18px; fill: #041208; }

        /* رسالة التنبيه العائمة */
        #toast {
            position: fixed; top: -80px; left: 50%; transform: translateX(-50%) scale(0.95);
            background: rgba(220, 38, 38, 0.95); color: #fff; padding: 12px 24px;
            border-radius: 30px; font-weight: 800; font-size: 13px; z-index: 999;
            opacity: 0; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3); backdrop-filter: blur(10px);
        }
        #toast.show { top: 25px; opacity: 1; transform: translateX(-50%) scale(1); }
        #toast.success { background: rgba(34, 197, 94, 0.95); box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body>

<div id="toast"><span id="toast-msg"></span></div>

<div class="promoter-card">
    <!-- مؤشر الحالة -->
    <div class="system-status">
        <div class="status-dot"></div>
        <span>النظام متصل وجاهز للاستلام</span>
    </div>

    <div class="logo-container">
        <img src="my-image.png" class="brand-logo" alt="Logo">
        <h1 class="title">تسجيل العملاء</h1>
        <div class="subtitle">VIP SECURE PORTAL</div>
    </div>

    <form id="promoterForm" novalidate>
        <!-- الاسم -->
        <div class="input-group" id="groupName">
            <label class="input-label">الاسم الكامل للزبون</label>
            <div class="input-wrapper">
                <input type="text" id="customerName" class="input-control" placeholder="اكتب اسم الزبون..." required autocomplete="off">
                <div class="field-check"></div>
            </div>
        </div>

        <!-- الهاتف -->
        <div class="input-group" id="groupPhone">
            <label class="input-label">رقم الهاتف</label>
            <div class="input-wrapper phone-wrapper">
                <input type="tel" id="phone" class="input-control phone-input" placeholder="07X XXXX XXXX" maxlength="13" required autocomplete="off">
                <div id="carrierBadge" class="carrier-badge"></div>
                <div class="field-check"></div>
            </div>
        </div>

        <!-- المحافظة -->
        <div class="input-group">
            <label class="input-label">المحافظة</label>
            <select id="governorate" class="input-control" required>
                <option value="البصرة" selected>البصرة</option>
                <option value="بغداد">بغداد</option>
                <option value="نينوى">نينوى</option>
                <option value="أربيل">أربيل</option>
                <option value="النجف">النجف</option>
                <option value="كربلاء">كربلاء</option>
                <option value="كركوك">كركوك</option>
                <option value="الأنبار">الأنبار</option>
                <option value="ديالى">ديالى</option>
                <option value="ميسان">ميسان</option>
                <option value="بابل">بابل</option>
                <option value="ذي قار">ذي قار</option>
                <option value="السليمانية">السليمانية</option>
                <option value="دهوك">دهوك</option>
                <option value="المثنى">المثنى</option>
                <option value="القادسية">القادسية</option>
                <option value="واسط">واسط</option>
                <option value="حلبجة">حلبجة</option>
            </select>
        </div>

        <!-- المنطقة -->
        <div class="input-group" id="groupRegion">
            <label class="input-label">اسم المنطقة / الحي</label>
            <div class="input-wrapper">
                <input type="text" id="region" class="input-control" placeholder="مثال: العشار، المنصور..." required autocomplete="off">
                <div class="field-check"></div>
            </div>
        </div>

        <!-- رقم الطلب -->
        <div class="input-group" id="groupOrder">
            <label class="input-label">رقم الطلب</label>
            <div class="input-wrapper">
                <input type="number" id="orderNumber" class="input-control" placeholder="اكتب رقم الطلب هنا..." min="1" required autocomplete="off">
                <div class="field-check"></div>
            </div>
        </div>

        <!-- نافذة المعاينة المباشرة للرسالة -->
        <div class="preview-box">
            <div class="preview-title">معاينة الرسالة اللحظية:</div>
            <div class="preview-content" id="livePreview">👤 الاسم الكامل: ...

📞 رقم الهاتف  :  ...

📍 العنوان بالتفصيل: 
البصرة - ...

✅ رقم الطلب  :  ...</div>
        </div>

        <!-- الأزرار -->
        <div class="actions-container">
            <button type="button" class="btn-copy" id="copyBtn">نسخ</button>
            <button type="submit" class="btn-submit">
                <svg class="wa-icon" viewBox="0 0 24 24">
                    <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.758.459 3.474 1.33 4.982L2 22l5.122-1.334c1.455.793 3.097 1.21 4.885 1.211h.005c5.507 0 9.99-4.478 9.99-9.985 0-2.667-1.039-5.174-2.928-7.062A9.917 9.917 0 0 0 12.012 2zm5.836 14.129c-.244.688-1.417 1.314-1.982 1.398-.506.076-1.148.107-1.853-.117-.427-.135-.975-.317-1.677-.621-2.951-1.275-4.88-4.246-5.027-4.442-.146-.196-1.196-1.595-1.196-3.044 0-1.448.762-2.158 1.03-2.453.27-.295.588-.368.784-.368.196 0 .392.001.564.01.18.009.423-.068.663.505.244.588.833 2.037.906 2.185.073.147.122.319.025.515-.098.196-.147.319-.294.491-.147.172-.31.385-.442.516-.147.147-.3.308-.129.602.172.294.762 1.251 1.636 2.03 1.123.998 2.07 1.308 2.364 1.455.294.147.466.123.637-.073.172-.196.735-.858.931-1.152.196-.295.392-.245.686-.147.294.098 1.861.877 2.18 1.036.319.159.53.235.603.358.073.123.073.712-.171 1.401z"/>
                </svg>
                <span>إرسال للواتساب</span>
            </button>
        </div>
    </form>
</div>

<script>
    function showToast(message, isSuccess = false) {
        if (navigator.vibrate) navigator.vibrate(40);
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-msg');
        msg.innerText = message;
        toast.className = isSuccess ? 'show success' : 'show';
        setTimeout(() => toast.className = '', 3000);
    }

    const nameInput = document.getElementById('customerName');
    const phoneInput = document.getElementById('phone');
    const govSelect = document.getElementById('governorate');
    const regionInput = document.getElementById('region');
    const orderInput = document.getElementById('orderNumber');
    const carrierBadge = document.getElementById('carrierBadge');
    const livePreview = document.getElementById('livePreview');

    // استرجاع البيانات المحفوظة (الحفظ التلقائي للمسودة)
    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('draft_name')) nameInput.value = localStorage.getItem('draft_name');
        if(localStorage.getItem('draft_phone')) phoneInput.value = localStorage.getItem('draft_phone');
        if(localStorage.getItem('draft_gov')) govSelect.value = localStorage.getItem('draft_gov');
        if(localStorage.getItem('draft_region')) regionInput.value = localStorage.getItem('draft_region');
        if(localStorage.getItem('draft_order')) orderInput.value = localStorage.getItem('draft_order');
        updateFormState();
    });

    function updateFormState() {
        const name = nameInput.value.trim();
        const phone = phoneInput.value.replace(/\s/g, '');
        const gov = govSelect.value;
        const region = regionInput.value.trim();
        const orderNum = orderInput.value.trim();

        // تحديث الصح والتحقق
        document.getElementById('groupName').classList.toggle('valid', name.length > 1);
        document.getElementById('groupPhone').classList.toggle('valid', phone.length === 11);
        document.getElementById('groupRegion').classList.toggle('valid', region.length > 1);
        document.getElementById('groupOrder').classList.toggle('valid', orderNum.length > 0);

        // حفظ تلقائي
        localStorage.setItem('draft_name', name);
        localStorage.setItem('draft_phone', phoneInput.value);
        localStorage.setItem('draft_gov', gov);
        localStorage.setItem('draft_region', region);
        localStorage.setItem('draft_order', orderNum);

        // تحديث المعاينة الحية
        const formatText = `👤 الاسم الكامل: ${name || '...'}\n\n📞 رقم الهاتف  :  ${phoneInput.value || '...'}\n\n📍 العنوان بالتفصيل: \n${gov} - ${region || '...'}\n\n✅ رقم الطلب  :  ${orderNum || '...'}`;
        livePreview.innerText = formatText;
    }

    // تفاعل الهاتف وشركاته
    phoneInput.addEventListener('input', function() {
        let val = this.value.replace(/\D/g, ''); 
        carrierBadge.className = 'carrier-badge';
        
        if (val.startsWith('078') || val.startsWith('079')) {
            carrierBadge.innerText = 'زين'; 
            carrierBadge.classList.add('badge-zain', 'active');
        } else if (val.startsWith('077')) {
            carrierBadge.innerText = 'آسيا'; 
            carrierBadge.classList.add('badge-asia', 'active');
        } else if (val.startsWith('075')) {
            carrierBadge.innerText = 'كورك'; 
            carrierBadge.classList.add('badge-korek', 'active');
        } else {
            carrierBadge.classList.remove('active');
        }

        let formatted = val;
        if (val.length > 4) formatted = val.slice(0, 4) + ' ' + val.slice(4);
        if (val.length > 7) formatted = val.slice(0, 4) + ' ' + val.slice(4, 7) + ' ' + val.slice(7, 11);
        this.value = formatted;
        updateFormState();
    });

    [nameInput, govSelect, regionInput, orderInput].forEach(el => {
        el.addEventListener('input', updateFormState);
        el.addEventListener('change', updateFormState);
    });

    // زر النسخ السريع
    document.getElementById('copyBtn').addEventListener('click', function() {
        const textToCopy = livePreview.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast("✓ تم نسخ بيانات الطلب للحافظة", true);
        });
    });

    // الإرسال للواتساب
    document.getElementById('promoterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = nameInput.value.trim();
        const phone = phoneInput.value.replace(/\s/g, ''); 
        const gov = govSelect.value;
        const region = regionInput.value.trim();
        const orderNum = orderInput.value.trim();

        if (!name) { showToast("⚠️ يرجى كتابة اسم الزبون"); return; }
        if (phone.length !== 11) { showToast("⚠️ يرجى التأكد من كتابة 11 رقماً لرقم الهاتف"); return; }
        if (!region) { showToast("⚠️ يرجى كتابة اسم المنطقة"); return; }
        if (!orderNum) { showToast("⚠️ يرجى كتابة رقم الطلب"); return; }

        if (navigator.vibrate) navigator.vibrate(30);

        const targetWhatsAppNumber = "9647888988288"; 
        const messageText = `👤 الاسم الكامل: ${name}\n\n📞 رقم الهاتف  :  ${phone}\n\n📍 العنوان بالتفصيل: \n${gov} - ${region}\n\n✅ رقم الطلب  :  ${orderNum}`;
        const encodedMsg = encodeURIComponent(messageText);

        window.location.href = `whatsapp://send?phone=${targetWhatsAppNumber}&text=${encodedMsg}`;

        // تفريغ المسطرة وحذف التخزين المؤقت بعد الإرسال الناجح
        setTimeout(() => {
            localStorage.clear();
            document.getElementById('promoterForm').reset();
            carrierBadge.className = 'carrier-badge';
            updateFormState();
        }, 1000);
    });
</script>
</body>
</html>
